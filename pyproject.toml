[project]
name = "sd-ca"
version = "0.1.0"
description = "SD-CA: hybrid LLM / diffusion / cellular-automaton mosaic system"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pillow>=11",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["applet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
